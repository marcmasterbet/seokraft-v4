/* Layout : une fiche, une partie par écran, barre de progression. Charte Seokraft. */
:root{--ivory:#f4f0e8;--paper:#fbf9f4;--ink:#151713;--muted:#6b6c63;--olive:#596247;--olive-soft:#e7e8dc;--stone:#ded8ce;--danger:#9a3b2a;
--serif:"Playfair Display",Georgia,serif;--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px}
.sheet{max-width:860px;margin:0 auto;background:var(--paper);border:1px solid var(--stone);box-shadow:0 30px 60px -40px rgba(21,23,19,.35)}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 28px;border-bottom:1px solid var(--stone);flex-wrap:wrap}
.brand{font-family:Manrope,var(--sans);font-weight:800;font-size:22px;letter-spacing:-.09em;line-height:1;text-decoration:none;color:var(--ink)}
.brand span{color:var(--olive)}
.brand small{display:block;font-family:var(--sans);font-size:8.5px;letter-spacing:.18em;font-weight:800;margin-top:4px}
.save{font-size:13px;color:var(--muted)}
.bar{height:3px;background:var(--stone)}.bar i{display:block;height:100%;width:0;background:var(--olive);transition:width .4s}
main{padding:44px clamp(20px,6vw,64px) 40px}
.count{display:flex;align-items:center;gap:10px;color:var(--olive);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.count::after{content:"";width:28px;height:1px;background:var(--olive)}
h1,h2{font-family:var(--serif);font-weight:400;letter-spacing:-.03em;line-height:1.12;text-wrap:balance;margin:12px 0 6px}
h1{font-size:clamp(30px,4.4vw,44px)} h2{font-size:clamp(26px,3.6vw,36px)}
h1 em,h2 em{color:var(--olive)}
.sub{color:var(--muted);margin:0 0 30px;max-width:60ch}
.q{margin:0 0 28px}
.q label,.lbl{display:block;font-weight:600;margin-bottom:8px}
.q label .n{color:var(--olive);font-weight:600;margin-right:4px}
textarea,input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;color:var(--ink);background:var(--ivory);border:1px solid var(--stone);border-radius:0;padding:12px 14px;outline:none}
textarea{min-height:84px;resize:vertical} textarea.big{min-height:120px}
textarea:focus,input:focus{border-color:var(--olive);box-shadow:inset 0 0 0 1px var(--olive)}
.intro{font-size:15px;color:var(--muted);margin:-2px 0 10px}
.grid{width:100%;border-collapse:collapse;margin-bottom:8px}
.gridwrap{overflow-x:auto;margin-bottom:28px}
.grid th{background:var(--ink);color:var(--paper);text-align:left;font-size:13px;font-weight:600;padding:8px 10px}
.grid td{border:1px solid var(--stone);padding:0}
.grid td input{border:0;background:transparent;padding:10px}
.add{background:none;border:0;padding:0;font:inherit;font-size:14px;color:var(--olive);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-bottom:28px}
.checks label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--stone);padding:10px 12px;cursor:pointer;font-weight:400;margin:0}
.checks label:has(input:checked){border-color:var(--olive);background:var(--olive-soft)}
.checks input[type=checkbox]{accent-color:var(--olive);width:17px;height:17px;margin-top:3px;flex:none}
.checks .other{display:flex;flex-direction:column;gap:6px;width:100%}
.checks .other input[type=text]{padding:6px 8px;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two .q{margin-bottom:6px}
.req{color:var(--danger)}
.err{color:var(--danger);font-size:15px;min-height:24px;margin:4px 0 0}
.nav{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;padding-top:24px;border-top:1px solid var(--stone)}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--olive);color:var(--paper);border:0;border-radius:0;font:inherit;font-weight:600;font-size:15px;padding:15px 26px;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.ghost{background:none;border:0;font:inherit;color:var(--muted);cursor:pointer;padding:8px 0}
.ghost:hover{color:var(--ink)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 26px;padding:0;list-style:none}
.steps li{font-size:13px;border:1px solid var(--stone);padding:4px 10px;color:var(--muted)}
.steps li.done{background:var(--olive-soft);color:var(--olive);border-color:var(--olive-soft)}
.note{background:var(--olive-soft);padding:16px 18px;margin:0 0 28px;font-size:15px}
.note b{color:var(--olive)}
.recap{border-top:1px solid var(--stone);margin:0 0 24px}
.recap div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--stone);font-size:15px}
.recap span:last-child{color:var(--muted);white-space:nowrap}
.legal{font-size:13px;color:var(--muted);max-width:62ch}
:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
@media (max-width:640px){.two{grid-template-columns:1fr}.head{padding:16px 20px}main{padding:32px 20px}}
</style>
</head>

<div class="sheet">
 <header class="head">

 </header>

</div>
<script>
/* ===== À CONFIGURER =====
   Coller ici l'adresse de l'application Google Apps Script (voir le guide fourni).
   Tant qu'elle est vide, le bouton d'envoi propose d'envoyer les réponses par e-mail. */
const ENDPOINT = "/api/questionnaire"; /* Réponses rangées dans le CRM SEOKRAFT (avant : Google Apps Script, bloqué par la sécurité du site). */
const MAIL = "contact@seokraft.fr";
/* ======================== */
const SECTIONS = [{"t": "Votre activité", "sub": "Comprendre votre entreprise et son point de départ.", "items": [{"k": "q", "t": "Décrivez votre activité en quelques phrases : ce que vous faites, pour qui, et depuis quand.", "big": true}, {"k": "q", "t": "Quels services ou prestations proposez-vous ? Lesquels comptent le plus pour vous ?", "big": true}, {"k": "q", "t": "Pourquoi lancer ce projet maintenant ?", "big": false}, {"k": "q", "t": "Avez-vous déjà un site internet ? Si oui, quelle est son adresse et qu'est-ce qui ne vous convient pas ?", "big": false}, {"k": "q", "t": "Où êtes-vous présent en ligne aujourd'hui : fiche Google, réseaux sociaux, annuaires, autres ?", "big": false}]}, {"t": "Vos objectifs", "sub": "Ce que votre site doit réellement vous apporter.", "items": [{"k": "t", "cols": ["Objectif", "Comment saurez-vous qu'il est atteint ?"], "rows": 3, "intro": "Indiquez jusqu'à 3 objectifs. Exemple : recevoir 5 demandes de devis par mois.", "label": null}, {"k": "q", "t": "Que doit faire en priorité un visiteur sur votre site : appeler, demander un devis, réserver, acheter, venir sur place ?", "big": false}]}, {"t": "Vos clients", "sub": "À qui s'adresse le site, et ce qui les décide.", "items": [{"k": "q", "t": "Qui sont vos clients idéaux : particuliers ou professionnels, secteur, âge, lieu ?", "big": false}, {"k": "q", "t": "Quel problème résolvez-vous pour eux, et qu'est-ce que ça change concrètement ?", "big": true}, {"k": "q", "t": "Qu'est-ce qui les fait hésiter avant de vous contacter ?", "big": false}, {"k": "q", "t": "Comment vos clients vous trouvent-ils aujourd'hui ?", "big": false}]}, {"t": "Votre offre et vos preuves", "sub": "Ce que vous vendez, et ce qui donne confiance.", "items": [{"k": "q", "t": "Pourquoi un client devrait-il vous choisir plutôt qu'un concurrent ?", "big": true}, {"k": "q", "t": "Quelle est votre offre principale, son prix (même approximatif) et ce qui est inclus ?", "big": false}, {"k": "q", "t": "Y a-t-il une offre ou une spécialité que vous voulez développer dans les prochains mois ?", "big": false}, {"k": "q", "t": "Votre expérience : depuis quand exercez-vous, et avez-vous des diplômes, certifications ou labels à mettre en avant ?", "big": false}, {"k": "q", "t": "Avez-vous des chiffres, des réalisations, des clients connus ou des avis à mettre en avant ?", "big": false}]}, {"t": "Votre image et votre ton", "sub": "La personnalité que votre site doit refléter.", "items": [{"k": "q", "t": "Quelles qualités voulez-vous qu'un visiteur retienne de vous ?", "big": false}, {"k": "q", "t": "Quel ton souhaitez-vous pour vos textes, et préférez-vous tutoyer ou vouvoyer vos visiteurs ?", "big": false}, {"k": "q", "t": "Y a-t-il quelque chose sur vous ou votre parcours qui doit absolument apparaître ?", "big": false}]}, {"t": "Votre visibilité sur Google", "sub": "Les recherches sur lesquelles vos clients doivent vous trouver.", "items": [{"k": "q", "t": "Quels mots vos clients tapent-ils sur Google pour trouver un professionnel comme vous ?", "big": false}, {"k": "q", "t": "Dans quelles villes ou quelles zones voulez-vous attirer des clients ?", "big": false}, {"k": "q", "t": "Quels sont vos trois principaux concurrents ? Ajoutez leur site si vous le connaissez.", "big": false}]}, {"t": "Pages et contenus", "sub": "Ce que contiendra le site et ce dont vous disposez déjà.", "items": [{"k": "q", "t": "Quelles pages imaginez-vous : accueil, prestations, réalisations, à propos, contact, autres ? Si vous ne savez pas, dites-le, nous en parlerons.", "big": false}, {"k": "c", "opts": ["Logo", "Couleurs et polices définies", "Photos professionnelles", "Vidéos", "Rien pour l'instant"], "label": "Ce dont vous disposez déjà"}]}, {"t": "Fonctionnalités", "sub": "Ce que le site doit permettre de faire.", "items": [{"k": "c", "opts": ["Formulaire de contact ou de demande de devis", "Prise de rendez-vous en ligne", "Galerie de réalisations", "Avis Google affichés sur le site", "Blog ou actualités", "Boutique ou paiement en ligne", "Newsletter", "Site en plusieurs langues", "Espace client", "Autre :"], "label": "Cochez ce qui vous intéresse"}, {"k": "q", "t": "Parmi ces fonctionnalités, qu'est-ce qui est indispensable dès la mise en ligne, et qu'est-ce qui peut attendre ?", "big": false}]}, {"t": "Style et inspirations", "sub": "L'univers graphique qui vous ressemble.", "items": [{"k": "q", "t": "Citez trois sites que vous aimez, même hors de votre secteur, et dites pourquoi. Ajoutez les liens.", "big": true}, {"k": "q", "t": "Qu'est-ce que vous ne voulez surtout pas : couleurs, style, ton, effets ?", "big": false}]}, {"t": "Accès et outils", "sub": "Ce qui existe déjà et qu'il faudra reprendre ou relier.", "items": [{"k": "c", "opts": ["Nom de domaine", "Hébergement", "Fiche Google (Google Business Profile)", "Adresse e-mail professionnelle", "Outil de réservation, de facturation ou CRM", "Autre :"], "label": "Ce que vous avez déjà"}, {"k": "q", "t": "Y a-t-il des outils à conserver ou à relier au site : agenda, facturation, e-mailing, autres ?", "big": false}]}, {"t": "Budget et calendrier", "sub": "Pour vous proposer une solution réaliste.", "items": [{"k": "t", "cols": ["Budget envisagé", "Mise en ligne souhaitée", "Date impérative ?"], "rows": 1, "intro": null, "label": null}, {"k": "q", "t": "Un événement ou une contrainte impose-t-il une mise en ligne avant une date précise ?", "big": false}]}, {"t": "Après la mise en ligne", "sub": "Comment votre site vivra ensuite.", "items": [{"k": "c", "opts": ["Je veux pouvoir modifier certains contenus moi-même", "Je souhaite un suivi : mises à jour, corrections, petites évolutions", "Je souhaite être accompagné sur le référencement", "Je ne sais pas encore"], "label": null}, {"k": "q", "t": "Quelles évolutions envisagez-vous déjà pour la suite ?", "big": false}, {"k": "q", "t": "Y a-t-il une information importante que nous n'avons pas abordée ?", "big": false}]}];
const params = new URLSearchParams(location.search);
const KEY = "seokraft-site-" + (params.get("client") || "general");
let state = load() || { step: 0, f: {} };
if (!state.draftId) state.draftId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/-/g,"").slice(0,20);
if (params.get("entreprise") && !state.f.entreprise) state.f.entreprise = params.get("entreprise");
if (params.get("site") && !state.f["q4"]) state.f["q4"] = params.get("site");
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(state)); $("#save").textContent = "Réponses gardées à " + new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) + " · vous pouvez fermer cette page"; } catch(e){ $("#save").textContent = "Utilisez « Reprendre plus tard » pour garder vos réponses."; } }
function resumeUrl(){ const u = new URL(location.href); u.search = ""; u.hash = ""; const q = new URLSearchParams(location.search); q.delete("reprise"); q.set("reprise", state.draftId); return u.toString() + "?" + q.toString(); }
async function saveDraft(){
  const e = $("#err") || $("#draftmsg");
  const msg = $("#draftmsg");
  if (!ENDPOINT) { msg.textContent = "Vos réponses sont gardées sur cet appareil. Revenez avec le même lien pour reprendre."; return; }
  msg.textContent = "Enregistrement…";
  try {
    const rd = await fetch(ENDPOINT, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ type:"draft", total: SECTIONS.length, id: state.draftId, state, entreprise: state.f.entreprise, nom: state.f.nom, email: state.f.email, resumeUrl: resumeUrl() }) });
    if (!rd.ok) throw new Error("HTTP " + rd.status);
    msg.innerHTML = "C'est enregistré. Un lien pour reprendre vous a été envoyé à <b>" + esc(state.f.email) + "</b>, valable sur n'importe quel appareil.";
  } catch(err) { msg.textContent = "L'enregistrement en ligne n'a pas fonctionné, mais vos réponses restent gardées sur cet appareil."; }
}
window.addEventListener("beforeunload", ev => { if (state.step > 0 && !state.sent) { ev.preventDefault(); ev.returnValue = ""; } });

// numérotation des questions et identifiants
let qn = 0;
SECTIONS.forEach((s, si) => s.items.forEach((it, ii) => {
  if (it.k === "q") { qn++; it.n = qn; it.id = "q" + qn; } else it.id = "s" + si + "i" + ii;
}));
const TOTAL = SECTIONS.length + 2; // coordonnées + parties + envoi

function field(it){
  const v = state.f[it.id];
  if (it.k === "q") return `<div class="q"><label for="${it.id}"><span class="n">${it.n}.</span>${esc(it.t)}</label><textarea id="${it.id}" class="${it.big?"big":""}" data-id="${it.id}">${esc(v)}</textarea></div>`;
  if (it.k === "t") {
    const rows = Math.max(it.rows, (v||[]).length);
    let h = it.label ? `<span class="lbl">${esc(it.label)}</span>` : "";
    if (it.intro) h += `<p class="intro">${esc(it.intro)}</p>`;
    h += `<div class="gridwrap"><table class="grid" data-table="${it.id}"><tr>${it.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>`;
    for (let r=0;r<rows;r++) h += `<tr>${it.cols.map((c,ci)=>`<td><input type="text" aria-label="${esc(c)}, ligne ${r+1}" data-id="${it.id}" data-r="${r}" data-c="${ci}" value="${esc(((v||[])[r]||[])[ci])}"></td>`).join("")}</tr>`;
    h += `</table>${it.rows>1?`<button type="button" class="add" data-add="${it.id}">+ Ajouter une ligne</button>`:""}</div>`;
    return h;
  }
  if (it.k === "c") {
    const sel = v || {};
    let h = it.label ? `<span class="lbl">${esc(it.label)}</span>` : "";
    h += `<div class="checks">` + it.opts.map((o,oi)=> o.startsWith("Autre")
      ? `<label><input type="checkbox" data-id="${it.id}" data-o="${oi}" ${sel[oi]?"checked":""}><span class="other">Autre :<input type="text" aria-label="Autre, précisez" data-id="${it.id}" data-other="${oi}" value="${esc(sel["o"+oi])}"></span></label>`
      : `<label><input type="checkbox" data-id="${it.id}" data-o="${oi}" ${sel[oi]?"checked":""}><span>${esc(o)}</span></label>`).join("") + `</div>`;
    return h;
  }
}

function render(){
  const s = state.step;
  $("#bar").style.width = (s / (TOTAL-1) * 100) + "%";
  let h = "";
  if (s === 0) {
    const ent = state.f.entreprise;
    h = `<div class="count">Questionnaire de projet</div>
    <h1>${ent ? esc(ent) + ", parlons" : "Parlons"} de <em>votre futur site.</em></h1>
    <p class="sub">Ce questionnaire m'aide à bien comprendre votre activité, vos clients, vos attentes et ce que votre site doit vous apporter. Comptez 20 à 30 minutes. Vos réponses sont gardées au fur et à mesure. Pour finir plus tard sur un autre appareil, cliquez « Reprendre plus tard » : vous recevrez un lien par e-mail.</p>
    <div class="note"><b>Comment répondre :</b> avec vos mots, inutile d'être technique. Décrivez votre besoin plutôt qu'une solution. Si une question ne vous concerne pas, écrivez « Sans objet ». Un doute ? Écrivez-le aussi, c'est utile pour cerner votre projet.</div>
    <div class="two">
      <div class="q"><label for="nom">Votre prénom et nom <span class="req">*</span></label><input type="text" id="nom" data-id="nom" autocomplete="name" value="${esc(state.f.nom)}"></div>
      <div class="q"><label for="entreprise">Entreprise / activité <span class="req">*</span></label><input type="text" id="entreprise" data-id="entreprise" autocomplete="organization" value="${esc(state.f.entreprise)}"></div>
      <div class="q"><label for="email">E-mail <span class="req">*</span></label><input type="email" id="email" data-id="email" autocomplete="email" value="${esc(state.f.email)}"></div>
      <div class="q"><label for="tel">Téléphone <span class="req">*</span></label><input type="tel" id="tel" data-id="tel" autocomplete="tel" value="${esc(state.f.tel)}"></div>
    </div>
    <div class="q" style="margin-top:12px"><label for="projet">Nom du projet (facultatif)</label><input type="text" id="projet" data-id="projet" placeholder="Ex. : nouveau site de la menuiserie" value="${esc(state.f.projet)}"></div>
    <p class="err" id="err" role="alert"></p>
    <div class="nav"><span></span><button class="btn" id="next">Commencer →</button></div>`;
  } else if (s <= SECTIONS.length) {
    const sec = SECTIONS[s-1];
    h = `<div class="count">Partie ${s} sur ${SECTIONS.length}</div><h2>${esc(sec.t)}</h2><p class="sub">${esc(sec.sub)}</p>`
      + sec.items.map(field).join("")
      + `<div class="nav"><button class="ghost" id="prev">← Partie précédente</button><span style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><button class="ghost" id="later">Reprendre plus tard</button><button class="btn" id="next">${s===SECTIONS.length?"Vérifier et envoyer →":"Partie suivante →"}</button></span></div><p class="err" id="draftmsg" role="status" style="color:var(--muted);text-align:right"></p>`;
  } else {
    const rows = SECTIONS.map((sec,i)=>{ const qs = sec.items.filter(it=>it.k==="q"); const done = qs.filter(it=>(state.f[it.id]||"").trim()).length;
      return `<div><span>${i+1}. ${esc(sec.t)}</span><span>${qs.length?done+" / "+qs.length+(qs.length>1?" réponses":" réponse"):"Tableau ou cases"}</span></div>`; }).join("");
    h = `<div class="count">Dernière étape</div><h2>Tout est prêt, <em>il ne reste qu'à envoyer.</em></h2>
    <p class="sub">Vérifiez d'un coup d'œil, puis envoyez. Je lis tout attentivement et je reviens vers vous sous 24 heures pour en parler.</p>
    <div class="recap">${rows}</div>
    <p class="legal">En envoyant ce questionnaire, vous acceptez que SEOKRAFT conserve ces informations pour comprendre votre projet et vous recontacter à ce sujet. Rien d'autre, jamais revendu. <a href="https://www.seokraft.fr/politique-de-confidentialite" target="_blank" rel="noopener" style="color:inherit">Politique de confidentialité</a></p>
    <p class="err" id="err" role="alert"></p>
    <div class="nav"><button class="ghost" id="prev">← Modifier mes réponses</button><button class="btn" id="send">Envoyer le questionnaire</button></div>`;
  }
  $("#main").innerHTML = h;
  window.scrollTo({top:0,behavior:"smooth"});
  bind();
}

function bind(){
  $("#main").querySelectorAll("[data-id]").forEach(el => el.addEventListener("input", () => {
    const id = el.dataset.id;
    if (el.dataset.r !== undefined) { const t = state.f[id] = state.f[id] || []; (t[el.dataset.r] = t[el.dataset.r] || [])[el.dataset.c] = el.value; }
    else if (el.dataset.o !== undefined) { (state.f[id] = state.f[id] || {})[el.dataset.o] = el.checked; }
    else if (el.dataset.other !== undefined) { const o = state.f[id] = state.f[id] || {}; o["o"+el.dataset.other] = el.value; if (el.value) { o[el.dataset.other] = true; el.closest("label").querySelector("input[type=checkbox]").checked = true; } }
    else state.f[id] = el.value;
    persist();
  }));
  $("#main").querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.add; const it = SECTIONS.flatMap(s=>s.items).find(x=>x.id===id);
    const t = state.f[id] = state.f[id] || []; while (t.length < Math.max(it.rows, t.length)) t.push([]); t.push([]); persist(); render();
  }));
  $("#next") && $("#next").addEventListener("click", () => {
    if (state.step === 0) {
      const f = state.f, e = $("#err");
      if (!f.nom || !f.entreprise || !f.email || !f.tel) { e.textContent = "Indiquez votre nom, votre entreprise, votre e-mail et votre téléphone."; return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email)) { e.textContent = "Cette adresse e-mail semble incomplète."; return; }
    }
    state.step++; persist(); render();
  });
  $("#prev") && $("#prev").addEventListener("click", () => { state.step--; persist(); render(); });
  $("#send") && $("#send").addEventListener("click", send);
  $("#later") && $("#later").addEventListener("click", saveDraft);
}

function asText(){
  const f = state.f; const L = [];
  L.push("QUESTIONNAIRE DE PROJET — " + (f.entreprise||""), "", "Nom : "+(f.nom||""), "Entreprise : "+(f.entreprise||""), "E-mail : "+(f.email||""), "Téléphone : "+(f.tel||""), "Projet : "+(f.projet||""), "Envoyé le : "+new Date().toLocaleString("fr-FR"), "");
  SECTIONS.forEach((s,i)=>{ L.push("", (i+1)+". "+s.t.toUpperCase(), "");
    s.items.forEach(it=>{
      if (it.k==="q") L.push(it.n+". "+it.t, "→ "+((f[it.id]||"").trim()||"(sans réponse)"), "");
      if (it.k==="t") { const rows=(f[it.id]||[]).filter(r=>r&&r.some(x=>x&&x.trim())); L.push((it.label||it.intro||"Tableau")+" ["+it.cols.join(" | ")+"]"); rows.length?rows.forEach(r=>L.push("→ "+it.cols.map((c,ci)=>(r[ci]||"—")).join(" | "))):L.push("→ (vide)"); L.push(""); }
      if (it.k==="c") { const o=f[it.id]||{}; const sel=it.opts.map((x,oi)=>o[oi]?(x.startsWith("Autre")?"Autre : "+(o["o"+oi]||""):x):null).filter(Boolean); L.push((it.label||"Cases cochées")+" : "+(sel.join(", ")||"aucune"), ""); }
    }); });
  return L.join("\n");
}
function asRow(){
  const f = state.f; const row = {"Date":new Date().toLocaleString("fr-FR"),"Entreprise":f.entreprise,"Nom":f.nom,"E-mail":f.email,"Téléphone":f.tel,"Projet":f.projet||"","Lien client":params.get("client")||""};
  SECTIONS.forEach(s=>s.items.forEach(it=>{
    if (it.k==="q") row[it.n+". "+it.t] = f[it.id]||"";
    if (it.k==="t") row[it.label||it.cols.join(" / ")] = (f[it.id]||[]).filter(r=>r&&r.some(x=>x&&x.trim())).map(r=>it.cols.map((c,ci)=>r[ci]||"—").join(" | ")).join("\n");
    if (it.k==="c") { const o=f[it.id]||{}; row[it.label||s.t+" (cases)"] = it.opts.map((x,oi)=>o[oi]?(x.startsWith("Autre")?"Autre : "+(o["o"+oi]||""):x):null).filter(Boolean).join(", "); }
  }));
  return row;
}
async function send(){
  const b = $("#send"), e = $("#err"); const text = asText();
  if (!ENDPOINT) {
    try { await navigator.clipboard.writeText(text); } catch(_) {}
    e.style.color = "var(--muted)";
    e.innerHTML = `Vos réponses sont copiées. Collez-les dans un e-mail à <b>${MAIL}</b>. <a href="mailto:${MAIL}?subject=${encodeURIComponent("Questionnaire de projet — "+(state.f.entreprise||""))}" style="color:inherit">Ouvrir ma messagerie</a>`;
    return;
  }
  b.disabled = true; b.textContent = "Envoi en cours…"; e.textContent = "";
  try {
    const rf = await fetch(ENDPOINT, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ type:"final", id: state.draftId, row: asRow(), text, entreprise: state.f.entreprise, email: state.f.email }) });
    if (!rf.ok) throw new Error("HTTP " + rf.status);
    state.sent = true; persist();
    $("#bar").style.width = "100%";
    $("#main").innerHTML = `<div class="count">Questionnaire envoyé</div><h2>Merci ${esc((state.f.nom||"").split(" ")[0])}, <em>c'est bien reçu.</em></h2>
      <p class="sub">Je lis vos réponses avec attention et je reviens vers vous sous 24 heures pour en parler ensemble. Une copie de vos réponses reste enregistrée sur cet appareil.</p>
      <p class="sub" style="margin:0">Marc Bretzner · SEOKRAFT · ${MAIL}</p>`;
  } catch(err) {
    b.disabled = false; b.textContent = "Réessayer l'envoi";
    try { await navigator.clipboard.writeText(text); } catch(_) {}
    e.innerHTML = `L'envoi n'a pas fonctionné, mais vos réponses sont conservées. Réessayez dans un instant, ou envoyez-les par e-mail : elles sont copiées, il suffit de les coller dans un message à <b>${MAIL}</b>. <a href="mailto:${MAIL}?subject=${encodeURIComponent("Questionnaire de projet — "+(state.f.entreprise||""))}" style="color:inherit">Ouvrir ma messagerie</a>`;
  }
}
(async function start(){
  const rid = params.get("reprise");
  if (rid && ENDPOINT && rid !== state.draftId) {
    $("#main").innerHTML = '<p class="sub">Chargement de vos réponses…</p>';
    try {
      const r = await fetch(ENDPOINT + "?id=" + encodeURIComponent(rid));
      const d = await r.json();
      if (d && d.state) { state = d.state; state.draftId = rid; persist(); }
    } catch(e) {}
  }
  render();
})();
</script>
</body>
</html>
